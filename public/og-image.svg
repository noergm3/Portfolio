<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F7CD00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f0f1a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#F7CD00" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f1a" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect x="15" y="15" width="1170" height="600" rx="16" fill="none" stroke="#1e1e32" stroke-width="4" />

  <!-- Brand Prefix -->
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#F7CD00" letter-spacing="1">
    &lt; <tspan fill="#ffffff">Ing.</tspan> Noé González Mendoza /&gt;
  </text>

  <!-- Main Title -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Senior Frontend Engineer
  </text>

  <!-- Core Specialization -->
  <text x="80" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#F7CD00">
    React · Next.js · JavaScript
  </text>

  <!-- Differentiators & Tagline -->
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#b8b8c7">
    Enterprise Applications · Multi-Tenant SaaS Architectures · Node.js &amp; APIs
  </text>
  <text x="80" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#8e8e9f">
    Managua, Nicaragua · 10+ Years Building Production Systems
  </text>

  <!-- Remote Availability Badge -->
  <g transform="translate(80, 470)">
    <rect width="460" height="48" rx="24" fill="#2ed573" fill-opacity="0.12" stroke="#2ed573" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="28" cy="24" r="6" fill="#2ed573" />
    <text x="46" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#2ed573">
      Available for Remote Opportunities
    </text>
  </g>
